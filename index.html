<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<h1>Weather App</h1>
<div class="search">
<input type="text" id="cityInput" placeholder="Enter city name (e.g. Noida)">
<button id="searchBtn">Search</button>
</div>
<p id="message" class="message"></p>
<div id="weatherCard" class="card hidden">
<h2 id="cityName"></h2>
<p id="description" class="desc"></p>
<p id="temperature" class="temp"></p>
<div class="details">
<p>Feels like: <span id="feelsLike"></span></p>
<p>Humidity: <span id="humidity"></span></p>
<p>Wind: <span id="wind"></span></p>
</div>
</div>
</main>
<script src="script.js"></script>
</body>
</html>
